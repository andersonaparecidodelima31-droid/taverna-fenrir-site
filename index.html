<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const VIDEO_FRENTE_TAVERNA = "ma_aCbNxNQc";
  const VIDEO_RUNA_BALCAO = "iQ_rePerQKo";
  const VIDEO_MUSICA_AMBIENTE = "2zLQ-JMOB6Q";

  let playerFrente, playerRuna, playerMusica, playerAmbiente;
  let ambientesAbertos = false;
  let audioRunaTocando = false;
  let transicaoDisparada = false;

  // ============================================
  // INICIALIZAÇÃO DOS PLAYERS
  // ============================================
  function onYouTubeIframeAPIReady() {
    // Player da frente da taverna (transição)
    playerFrente = new YT.Player('videoFrente', {
      height: '100%', width: '100%',
      videoId: VIDEO_FRENTE_TAVERNA,
      playerVars: {
        'autoplay': 0, 'controls': 0, 'modestbranding': 1,
        'playsinline': 1, 'rel': 0, 'mute': 1
      },
      events: {
        'onReady': (e) => e.target.pauseVideo(),
        'onStateChange': onFrenteStateChange
      }
    });

    // Player da Runa no balcão (Hero) — pré-carrega em loop
    playerRuna = new YT.Player('videoRunaBalcao', {
      height: '100%', width: '100%',
      videoId: VIDEO_RUNA_BALCAO,
      playerVars: {
        'autoplay': 0, 'controls': 0, 'modestbranding': 1,
        'playsinline': 1, 'rel': 0, 'mute': 1,
        'loop': 1, 'playlist': VIDEO_RUNA_BALCAO
      }
    });

    // Player da música ambiente
    playerMusica = new YT.Player('musicaAmbiente', {
      height: '0', width: '0',
      videoId: VIDEO_MUSICA_AMBIENTE,
      playerVars: {
        'autoplay': 0, 'controls': 0, 'modestbranding': 1,
        'loop': 1, 'playlist': VIDEO_MUSICA_AMBIENTE
      },
      events: {
        'onReady': (e) => e.target.setVolume(20)
      }
    });
  }

  // ============================================
  // 1. ENTRAR NA TAVERNA
  // ============================================
  function entrarNaTaverna() {
    // Pré-carrega a Hero em segundo plano (muda, loop, oculta)
    if (playerRuna && playerRuna.playVideo) {
      playerRuna.setVolume(0);
      playerRuna.playVideo();
    }

    // Mostra e dá play no vídeo da frente (mudo para bypassar o bloqueio)
    const videoBg = document.getElementById('heroVideoBg');
    if (videoBg) videoBg.style.display = 'block';

    if (playerFrente && playerFrente.playVideo) {
      playerFrente.playVideo();
    }

    // Toca o áudio de boas-vindas (funciona porque veio do gesto do usuário)
    const audio = document.getElementById('boasVindas');
    if (audio) {
      audio.volume = 0.3;
      audio.play().catch(e => console.log("Áudio bloqueado:", e));
    }

    // Fallback: se o vídeo da porta não terminar em 11s, dispara a transição
    setTimeout(() => {
      dispararTransicao();
    }, 11000);
  }

  function onFrenteStateChange(event) {
    // Estado 0 = vídeo terminou
    if (event.data === 0) {
      dispararTransicao();
    }
  }

  // ============================================
  // 2. TRANSIÇÃO PARA A HERO
  // ============================================
  function dispararTransicao() {
    if (transicaoDisparada) return;
    transicaoDisparada = true;

    // Esconde a tela de entrada
    document.getElementById('heroOverlay').classList.add('hidden');
    document.getElementById('mainRoom').classList.add('visible');

    // A Hero já está rodando em segundo plano — só garante que continua
    if (playerRuna && playerRuna.playVideo) {
      playerRuna.playVideo();
    }

    // Inicia a música ambiente a 20%
    iniciarMusica();
  }

  // ============================================
  // 3. MÚSICA AMBIENTE (20% fixo)
  // ============================================
  let musicaIniciada = false;
  function iniciarMusica() {
    if (musicaIniciada) return;
    musicaIniciada = true;

    if (playerMusica && playerMusica.playVideo) {
      playerMusica.setVolume(20);
      playerMusica.playVideo();
    }

    // Atualiza o slider visual para 20
    const slider = document.getElementById('volumeSlider');
    if (slider) slider.value = 20;
  }

  function toggleMusic() {
    const btn = document.getElementById('btnPlay');
    if (!playerMusica || !playerMusica.getPlayerState) return;

    if (playerMusica.getPlayerState() === 1) {
      playerMusica.pauseVideo();
      btn.textContent = "▶";
    } else {
      playerMusica.playVideo();
      btn.textContent = "❚❚";
    }
  }

  function ajustarVolume(valor) {
    if (playerMusica && playerMusica.setVolume) {
      playerMusica.setVolume(valor);
    }
  }

  // ============================================
  // 4. ABRIR AMBIENTE (vídeo de transição)
  // ============================================
  function abrirAmbiente(videoId) {
    // Pausa a Hero
    if (playerRuna && playerRuna.pauseVideo) {
      playerRuna.pauseVideo();
    }

    const modal = document.getElementById('modalAmbiente');

    // Cria o player do ambiente
    playerAmbiente = new YT.Player('ambienteFrame', {
      height: '100%', width: '100%',
      videoId: videoId,
      playerVars: {
        'autoplay': 1, 'controls': 0, 'modestbranding': 1,
        'playsinline': 1, 'rel': 0, 'mute': 0
      },
      events: {
        'onStateChange': onAmbienteStateChange
      }
    });

    modal.classList.add('active');
    ambientesAbertos = true;
  }

  function onAmbienteStateChange(event) {
    // Quando o vídeo do ambiente terminar
    if (event.data === 0) {
      fecharAmbiente();
    }
  }

  // ============================================
  // 5. FECHAR AMBIENTE → Hero retoma automaticamente
  // ============================================
  function fecharAmbiente() {
    document.getElementById('modalAmbiente').classList.remove('active');

    if (playerAmbiente) {
      playerAmbiente.destroy();
      playerAmbiente = null;
    }

    // A Hero retoma automaticamente — sem novo clique
    if (ambientesAbertos) {
      if (playerRuna && playerRuna.playVideo) {
        playerRuna.playVideo();
      }
      ambientesAbertos = false;
    }
  }

  // ============================================
  // 6. CARROSSEL DE FOTOS (conto do Bardo)
  // ============================================
  let slideAtual = 0;
  const totalSlides = 4;

  function mudarSlide(direcao) {
    slideAtual += direcao;
    if (slideAtual < 0) slideAtual = totalSlides - 1;
    if (slideAtual >= totalSlides) slideAtual = 0;
    atualizarCarrossel();
  }

  function irParaSlide(index) {
    slideAtual = index;
    atualizarCarrossel();
  }

  function atualizarCarrossel() {
    const slides = document.getElementById('carrosselSlides');
    slides.style.transform = 'translateX(-' + (slideAtual * 100) + '%)';
    document.querySelectorAll('#carrosselIndicadores span').forEach((dot, i) => {
      dot.classList.toggle('active', i === slideAtual);
    });
  }

  // ============================================
  // 7. ÁUDIO DA RUNA (conto "Sobre a Runa")
  // ============================================
  function toggleAudioRuna() {
    const audio = document.getElementById('audioRuna');
    const btn = document.getElementById('btnAudioRuna');

    if (audioRunaTocando) {
      audio.pause();
      btn.textContent = "▶";
      audioRunaTocando = false;
    } else {
      audio.play();
      btn.textContent = "❚❚";
      audioRunaTocando = true;
    }
  }
      </script>
