<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taverna Fenrir — Runa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'Roboto', sans-serif;
    font-size: 16px;
    line-height: 1.5;
    overflow-x: hidden;
  }
  h1, h2, h3 { font-family: 'Cinzel', serif; color: #c9a227; }

  .entrada {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #000 url('Entrada taverna.jpg') center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: opacity 0.8s ease;
  }
  .entrada.hidden { opacity: 0; pointer-events: none; }
  .entrada-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
  .entrada-conteudo { position: relative; z-index: 1; padding: 20px; }
  .entrada-conteudo h1 { font-size: 2.8rem; letter-spacing: 3px; margin-bottom: 5px; text-shadow: 0 2px 15px rgba(0,0,0,0.9); }
  .entrada-conteudo h2 { font-size: 1.2rem; color: #c9a227; letter-spacing: 6px; margin-bottom: 25px; font-weight: 400; }
  .entrada-conteudo p { font-size: 1rem; margin-bottom: 30px; color: #ccc; font-style: italic; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
  .btn-entrar {
    display: inline-block;
    background: #c9a227;
    color: #0a0a0a;
    padding: 16px 44px;
    border: none;
    border-radius: 30px;
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    animation: pulse 2s infinite;
  }
  .btn-entrar:hover { background: #d4af37; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201,162,39,0.7); }
    50% { box-shadow: 0 0 0 15px rgba(201,162,39,0); }
  }
  .entrada-hint { margin-top: 20px; font-size: 0.75rem; color: #ccc; letter-spacing: 1px; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }

  .conteudo { display: none; }
  .conteudo.visible { display: block; }

  .hero {
    position: relative;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    text-align: center;
  }
  .hero video {
    position: absolute;
    top: 50%; left: 50%;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    transform: translate(-50%, -50%);
    z-index: 0;
    pointer-events: none;
  }
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 75%);
    z-index: 1;
  }
  .hero-conteudo { position: relative; z-index: 2; padding: 60px 20px 50px 20px; width: 100%; }
  .hero-conteudo h2 { font-size: 2rem; margin-bottom: 20px; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
  .btn-historia {
    display: inline-block;
    background: #c9a227;
    color: #0a0a0a;
    padding: 15px 36px;
    border: none;
    border-radius: 30px;
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 35px;
    animation: pulse 2s infinite;
  }
  .btn-historia:hover { background: #d4af37; }
  .setas { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #c9a227; font-size: 1.4rem; animation: bounce 2s infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); opacity: 0.7; }
    50% { transform: translateY(10px); opacity: 1; }
  }

  section { padding: 60px 20px; max-width: 1100px; margin: 0 auto; }
  .titulo-secao { font-size: 1.8rem; margin-bottom: 10px; text-align: center; }
  .subtitulo-secao { text-align: center; color: #aaa; margin-bottom: 40px; font-size: 0.95rem; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  .card {
    background: rgba(139,0,0,0.08);
    border: 1px solid rgba(183,139,72,0.35);
    border-radius: 10px;
    padding: 22px;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    cursor: pointer;
  }
  .card:hover { border-color: #c9a227; transform: translateY(-3px); }
  .card-tag { display: inline-block; font-size: 0.75rem; color: #c9a227; border: 1px solid rgba(201,162,39,0.4); border-radius: 20px; padding: 3px 12px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .card h3 { font-size: 1.2rem; margin-bottom: 10px; }
  .card p { font-size: 0.9rem; color: #bbb; margin-bottom: 15px; }
  .card span { color: #c9a227; font-weight: 500; font-size: 0.9rem; }

  .contos { display: flex; flex-direction: column; gap: 18px; }
  .conto { background: rgba(139,0,0,0.06); border: 1px solid rgba(183,139,72,0.35); border-radius: 10px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .conto h3 { font-size: 1.15rem; margin-bottom: 8px; }
  .conto p { font-size: 0.9rem; color: #bbb; margin-bottom: 12px; }

  .audio-conto { margin-top: 15px; padding: 12px; background: rgba(201,162,39,0.1); border: 1px solid rgba(201,162,39,0.3); border-radius: 10px; display: flex; align-items: center; gap: 12px; }
  .audio-conto button { background: #c9a227; color: #0a0a0a; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 1rem; cursor: pointer; }
  .audio-conto span { color: #c9a227; font-size: 0.9rem; font-style: italic; }

  .carrossel { position: relative; margin: 20px 0; background: #000; border-radius: 10px; overflow: hidden; }
  .carrossel-slides { display: flex; transition: transform 0.4s ease; }
  .slide { min-width: 100%; position: relative; }
  .slide img { width: 100%; height: auto; display: block; }
